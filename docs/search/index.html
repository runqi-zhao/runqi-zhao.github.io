<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="search" type="application/opensearchdescription+xml" title="知识库" href="/opensearch.xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · 知识库</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --muted:#6b6b76; --line:#e3e3e8; --bg:#fbfbfd; --card:#fff; --accent:#c2185b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8ea; --muted:#9a9aa3; --line:#2c2c33; --bg:#161618; --card:#1d1d21; --accent:#ff6f9c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding:18px 20px 0; max-width:760px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 10px; font-weight:600; }
  h1 a { color:inherit; text-decoration:none; }
  form { display:flex; gap:8px; }
  input[type=search] { flex:1; padding:11px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); outline:none; }
  input[type=search]:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  main { max-width:760px; margin:0 auto; padding:6px 20px 60px; }
  .meta { color:var(--muted); font-size:13px; margin:14px 0 6px; }
  .hit { display:block; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); margin-bottom:10px; text-decoration:none; color:inherit; }
  .hit:hover, .hit.active { border-color:var(--accent); }
  .hit h2 { font-size:15px; margin:0 0 4px; font-weight:600; }
  .hit .path { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .hit p { margin:0; font-size:13.5px; color:var(--muted); }
  mark { background: color-mix(in srgb, var(--accent) 26%, transparent); color: inherit; padding:0 1px; border-radius:3px; }
  .ai { margin-top:26px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .ai a { color:var(--accent); }
  .empty { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<header>
  <h1><a href="/">Runqi 的知识库</a> · 全站搜索</h1>
  <form id="f" role="search">
    <input id="q" type="search" name="q" autofocus autocomplete="off" placeholder="搜笔记标题或正文，比如：Redis 持久化">
  </form>
</header>
<main>
  <div class="meta" id="meta"></div>
  <div id="hits"></div>
  <div class="ai" id="ai" hidden>
    没找到？换个关键词，或者 <a id="perplexity" href="#" target="_blank" rel="noopener">让 Perplexity 读站内内容回答</a>
    · <a id="google" href="#" target="_blank" rel="noopener">用 Google 站内搜</a>
  </div>
</main>
<script>
(function () {
  var index = null;
  var loaded = null;
  var hits = [];
  var active = -1;
  var qEl = document.getElementById('q');
  var hitsEl = document.getElementById('hits');
  var metaEl = document.getElementById('meta');
  var aiEl = document.getElementById('ai');

  function load() {
    if (!loaded) {
      loaded = fetch('/static/contentIndex.json', { cache: 'force-cache' })
        .then(function (r) { return r.json(); })
        .then(function (d) { index = Object.keys(d).map(function (k) { return d[k]; }); return index; });
    }
    return loaded;
  }

  function snippet(text, terms) {
    var lower = text.toLowerCase();
    var pos = -1;
    for (var i = 0; i < terms.length; i++) {
      var p = lower.indexOf(terms[i]);
      if (p >= 0 && (pos < 0 || p < pos)) pos = p;
    }
    if (pos < 0) return text.slice(0, 150);
    var start = Math.max(0, pos - 60);
    return (start > 0 ? '…' : '') + text.slice(start, start + 200).replace(/\s+/g, ' ');
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; });
  }

  function mark(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      if (!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }

  function search(query) {
    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < index.length; i++) {
      var n = index[i];
      var title = (n.title || '').toLowerCase();
      var body = (n.content || '').toLowerCase();
      var score = 0, all = true;
      for (var j = 0; j < terms.length; j++) {
        var t = terms[j];
        var inT = title.indexOf(t) >= 0;
        var inB = body.indexOf(t) >= 0;
        if (!inT && !inB) { all = false; break; }
        score += (inT ? 8 : 0) + (inB ? 2 : 0);
      }
      if (!all) continue;
      if (title === query.toLowerCase()) score += 20;
      out.push({ n: n, score: score });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 60);
  }

  function render(query) {
    hits = search(query);
    active = -1;
    if (!query.trim()) {
      hitsEl.innerHTML = '';
      metaEl.textContent = '输入关键词开始搜索（⌘/Ctrl + K 聚焦，↑↓ 选择，Enter 打开）';
      aiEl.hidden = true;
      return;
    }
    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    metaEl.textContent = '「' + query + '」命中 ' + hits.length + ' 篇' + (hits.length === 60 ? '（只显示前 60 条）' : '');
    hitsEl.innerHTML = hits.map(function (h, i) {
      var n = h.n;
      var snip = snippet((n.content || '').replace(/\s+/g, ' '), terms);
      return '<a class="hit" data-i="' + i + '" href="/' + encodeURI(n.slug) + '">' +
        '<h2>' + mark(n.title || n.filePath, terms) + '</h2>' +
        '<div class="path">' + esc(n.filePath || '') + '</div>' +
        '<p>' + mark(snip, terms) + '</p></a>';
    }).join('') || '<div class="empty">没有命中。试试更短的词，或用下面的 AI / Google。</div>';
    aiEl.hidden = false;
    document.getElementById('perplexity').href =
      'https://www.perplexity.ai/search?q=' + encodeURIComponent('site:runqi-zhao.github.io ' + query);
    document.getElementById('google').href =
      'https://www.google.com/search?q=' + encodeURIComponent('site:runqi-zhao.github.io ' + query);
  }

  function setActive(i) {
    var nodes = hitsEl.querySelectorAll('.hit');
    if (!nodes.length) return;
    active = (i + nodes.length) % nodes.length;
    nodes.forEach(function (el, k) { el.classList.toggle('active', k === active); });
    nodes[active].scrollIntoView({ block: 'nearest' });
  }

  function run() {
    var query = qEl.value;
    var url = new URL(location.href);
    if (query) url.searchParams.set('q', query); else url.searchParams.delete('q');
    history.replaceState(null, '', url);
    load().then(function () { render(query); });
  }

  qEl.addEventListener('input', run);
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (hits.length && active < 0) setActive(0);
    if (hits[active >= 0 ? active : 0]) location.href = hits[active >= 0 ? active : 0].n.slug ? '/' + encodeURI(hits[active >= 0 ? active : 0].n.slug) : '/';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Escape') { qEl.value = ''; run(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  var initial = new URL(location.href).searchParams.get('q') || '';
  qEl.value = initial;
  run();
})();
</script>
</body>
</html>
